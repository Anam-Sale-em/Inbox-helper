name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # No API keys here: tests use mock mode and never call a real model.
      - run: python -m pytest -q
      # Offline scores (duplicates, injection pre-check, names, no-reply) on every push.
      - run: python eval/offline_report.py
      # Load test with a simulated model: 82 and 1,000 messages, no keys, no cost.
      - run: python eval/stress.py --sizes 82 1000 --speedup 400
